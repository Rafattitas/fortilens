<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FortiLens Redesign Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@400;500;600&family=Funnel+Sans:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* Concept A, Precision: a bench instrument. Enamel chrome, white or slate measurement wells,
   stacked channels on one time base. Color is reserved for state.
   Concept B, Lens: pine-dark or celadon. One bold object, a 24-hour dial, and plain-language answers.
   Both rely on hatching for "no evidence", which is the shared signature of the product. */
:root{--p-bg:#2a2d31;--p-bar:#1f2124;--p-line:#3b3f45;--p-text:#eef0f2;--p-sub:#b4b9c0;color-scheme:dark}
.frame[data-c="a"]{--fb:"IBM Plex Sans",system-ui,"Segoe UI",sans-serif;--fd:"IBM Plex Sans",system-ui,sans-serif;--fc:"IBM Plex Sans",system-ui,sans-serif;--r1:3px;--r2:5px;--gap:10px}
.frame[data-c="b"]{--fb:"Funnel Sans",system-ui,"Segoe UI",sans-serif;--fd:"Funnel Display","Funnel Sans",system-ui,sans-serif;--fc:"Funnel Sans",system-ui,sans-serif;--r1:9px;--r2:20px;--gap:20px}
.frame[data-c="a"][data-t="light"]{color-scheme:light;--bg:#e4e8e7;--panel:#f3f5f4;--well:#ffffff;--raise:#e9eceb;--line:#c7cecd;--line2:#dce1e0;--ink:#14191b;--sub:#4a5559;--acc:#0c5a70;--on:#ffffff;--acc-s:#d3e6ea;--d:#17333e;--u:#6c858f;--good:#10694a;--warn:#855300;--bad:#ad231b;--unk:#566367;--good-b:#d7eee3;--warn-b:#f8e8c5;--bad-b:#f9dcd9;--unk-b:#e1e6e5;--hatch:#aeb8b6;--shadow:0 12px 40px #16242a33}
.frame[data-c="a"][data-t="dark"]{color-scheme:dark;--bg:#1a2024;--panel:#22292e;--well:#161b1f;--raise:#2c353a;--line:#3d484f;--line2:#2f393f;--ink:#e9eff1;--sub:#a7b5ba;--acc:#84c9dc;--on:#0e1a1e;--acc-s:#24414b;--d:#e9eff1;--u:#8399a3;--good:#6ad5a5;--warn:#efc35c;--bad:#ff9087;--unk:#9aa8ae;--good-b:#1c3a30;--warn-b:#3c3218;--bad-b:#452624;--unk-b:#2c363b;--hatch:#4e5b62;--shadow:0 12px 40px #0008}
.frame[data-c="b"][data-t="dark"]{color-scheme:dark;--bg:#0f2a2a;--panel:#153433;--well:#0c2323;--raise:#1c3f3d;--line:#2d5553;--line2:#214644;--ink:#eef7f2;--sub:#adc8c1;--acc:#8fe8d8;--on:#0a2020;--acc-s:#1f4c49;--d:#8fe8d8;--u:#ffb68a;--good:#86e6a8;--warn:#ffd166;--bad:#ff979c;--unk:#a3bcb5;--good-b:#1b4a3a;--warn-b:#4a4020;--bad-b:#522c33;--unk-b:#21403e;--hatch:#3f6865;--shadow:0 18px 60px #0009}
.frame[data-c="b"][data-t="light"]{color-scheme:light;--bg:#e6efe9;--panel:#f6faf7;--well:#ffffff;--raise:#dbe7e0;--line:#b8cac1;--line2:#d0ded6;--ink:#0c2b2a;--sub:#3f5d57;--acc:#0a6b66;--on:#ffffff;--acc-s:#cfe7e2;--d:#0a6b66;--u:#c0531a;--good:#0d6d45;--warn:#7f5100;--bad:#ad232b;--unk:#526c66;--good-b:#cfeadd;--warn-b:#f6e6c0;--bad-b:#f8dadb;--unk-b:#d9e4df;--hatch:#a4b9b0;--shadow:0 18px 60px #0c2b2a2e}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--p-bg);color:var(--p-text);font:13px/1.4 "IBM Plex Sans",system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,p,ul,ol,dl,dd,figure{margin:0;padding:0}ul,ol{list-style:none}
:focus-visible{outline:2px solid var(--acc,#9fd4e3);outline-offset:2px}
#proto{height:100%;display:flex;flex-direction:column}
.pbar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:6px 12px;background:var(--p-bar);border-bottom:1px solid var(--p-line)}
.pbar b{font-weight:600}
.pbar .note{color:var(--p-sub)}
.pbar label{display:flex;gap:6px;align-items:center;color:var(--p-sub)}
.pbar select{background:#2d3035;border:1px solid var(--p-line);border-radius:5px;padding:3px 6px;color:var(--p-text)}
.pseg{display:inline-flex;border:1px solid var(--p-line);border-radius:6px;overflow:hidden}
.pseg button{border:0;background:none;padding:3px 10px;color:var(--p-sub);cursor:pointer;white-space:nowrap}
.pseg button:hover{color:#fff;background:#2d3035}
.pseg button[aria-pressed="true"]{background:#e6e9ec;color:#16181b;font-weight:600}
.grow{flex:1}
.stage{flex:1;min-height:0;display:flex;justify-content:center;gap:8px}
.stage.framed{padding:12px}
.frame{container:app/inline-size;flex:1 1 0;min-width:0;height:100%;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.45 var(--fb);font-variant-numeric:tabular-nums}
.stage.framed .frame{border-radius:12px;flex:0 1 auto}
.stage.tablet .frame{width:834px}.stage.phone .frame{width:390px}.stage.compare .frame{flex:1 1 0;width:auto}
.frame[hidden]{display:none}
.frame button{cursor:pointer}

/* Shared primitives */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:32px;padding:5px 12px;border:1px solid var(--line);border-radius:var(--r1);background:var(--panel);font-weight:500;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:var(--sub)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on);font-weight:600}
.btn:disabled{opacity:.6;cursor:not-allowed}.btn.pri:disabled{background:var(--raise);border-color:var(--line);color:var(--sub);opacity:1;font-weight:500}
.ln{background:none;border:0;padding:0;color:var(--acc);font-weight:500;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.sub{color:var(--sub)}.sm{font-size:12.5px}.cond{font-family:var(--fc)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;white-space:nowrap;color:var(--unk)}
.st::before{content:"";width:8px;height:8px;flex:none;background:currentColor}
.st.up{color:var(--good)}.st.up::before{border-radius:50%}
.st.degraded{color:var(--warn)}.st.degraded::before{clip-path:polygon(50% 0,100% 100%,0 100%);width:10px;height:9px}
.st.down{color:var(--bad)}.st.down::before{border-radius:1px}
.st.idle{color:var(--sub)}.st.idle::before{background:transparent;border-radius:50%;box-shadow:inset 0 0 0 1.5px currentColor}.st.unknown::before{background:repeating-linear-gradient(135deg,currentColor 0 1.5px,transparent 1.5px 3.5px);border-radius:50%;box-shadow:inset 0 0 0 1px currentColor}
.seg{display:inline-flex;gap:2px;padding:2px;background:var(--raise);border-radius:calc(var(--r1) + 2px)}
.seg button{border:0;background:none;padding:3px 10px;min-height:26px;border-radius:var(--r1);color:var(--sub);font-weight:500;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--well);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.tabs{display:flex;gap:2px;margin-bottom:var(--gap);overflow-x:auto;overflow-y:hidden;box-shadow:inset 0 -1px var(--line)}
.tabs button{border:0;background:none;padding:7px 12px;color:var(--sub);font-weight:500;white-space:nowrap;border-bottom:2px solid transparent}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc)}
.alert{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:8px;background:var(--warn-b);margin-bottom:var(--gap)}
.alert strong{font-weight:600}
.alert p{flex:1 1 320px}
.alert .btn{background:var(--well)}
.note-bar{background:var(--raise)}
.panel{background:var(--panel);border-radius:var(--r2);padding:12px;min-width:0}
.ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 12px;margin-bottom:8px}
.ph h2,.ph h3{font-size:14px;font-weight:600}
.frame[data-c="b"] .ph h2,.frame[data-c="b"] .ph h3{font:500 19px/1.2 var(--fd)}
.pg{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between;align-items:flex-end;margin-bottom:var(--gap)}
.pg h1{font:600 19px/1.25 var(--fd)}
.frame[data-c="b"] .pg h1{font:500 38px/1.05 var(--fd);letter-spacing:-.015em}
.pg p{color:var(--sub);max-width:96ch}
.grid{display:grid;gap:var(--gap);grid-template-columns:repeat(12,minmax(0,1fr))}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c9{grid-column:span 9}.c12{grid-column:span 12}
.col{display:flex;flex-direction:column;gap:var(--gap);min-width:0}
.tw{overflow-x:auto;border-radius:var(--r2);background:var(--panel)}
table{width:100%;border-collapse:collapse}
th{font:500 12.5px var(--fc);color:var(--sub);text-align:left;padding:7px 10px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:7px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--raise)}
tr.sel{background:var(--acc-s)!important}
th.r,td.r{text-align:right;white-space:nowrap}
th button{border:0;background:none;padding:0;font:inherit;color:inherit}
th button:hover,th button[aria-pressed="true"]{color:var(--ink)}
.ent{border:0;background:none;padding:0;text-align:left;font-weight:500;color:var(--ink)}
.ent:hover{color:var(--acc);text-decoration:underline}
.ident{display:block;font:12.5px var(--fc);color:var(--sub)}
.flag{display:inline-block;padding:0 5px;border-radius:3px;background:var(--warn-b);color:var(--warn);font:500 12px var(--fc);white-space:nowrap}
.flag.q{background:var(--unk-b);color:var(--sub)}
.bar{display:flex;height:4px;background:var(--line2);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%}.bar .d{background:var(--d)}.bar .u{background:var(--u)}
.kv li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line2);align-items:baseline}
.kv li:last-child{border-bottom:0}.kv li>span:first-child{color:var(--sub)}
.field{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--sub);min-width:0}
.field input,.field select{min-height:32px;padding:5px 9px;border:1px solid var(--sub);border-radius:var(--r1);background:var(--well);color:var(--ink);font-size:14px;width:100%}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.bar-f{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end;margin-bottom:var(--gap)}
.tog{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2)}
.tog input{width:18px;height:18px;margin-top:1px;accent-color:var(--acc);flex:none}
.tog small{display:block;color:var(--sub);font-size:12.5px}
.empty{padding:44px 20px;text-align:center;color:var(--sub)}
.empty strong{display:block;color:var(--ink);font-size:15px;margin-bottom:4px;font-weight:600}
.sk{border-radius:var(--r1);background:linear-gradient(90deg,var(--raise),var(--line2),var(--raise));background-size:200% 100%;animation:sk 1.4s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.hatch{background:repeating-linear-gradient(135deg,var(--hatch) 0 1.5px,transparent 1.5px 6px)}

/* Lanes */
.lane{position:relative;height:100%;min-height:12px;overflow:hidden;background:var(--raise);border-radius:2px}
.lane i{position:absolute;top:0;bottom:0}
.lane .up{background:var(--good);opacity:.8}.frame[data-c="a"] .lane .up{opacity:.3}.frame[data-c="a"] .lkey .up::before{opacity:.3}.lane .degraded{background:var(--warn)}.lane .down{background:var(--bad)}
.lane .unknown{background:repeating-linear-gradient(135deg,var(--hatch) 0 1.5px,var(--raise) 1.5px 5px)}
.lkey{display:flex;flex-wrap:wrap;gap:3px 14px;font-size:12.5px;color:var(--sub)}
.lkey span::before{content:"";display:inline-block;width:10px;height:10px;margin-right:5px;border-radius:2px;vertical-align:-1px}
.lkey .up::before{background:var(--good);opacity:.8}.lkey .degraded::before{background:var(--warn)}.lkey .down::before{background:var(--bad)}
.lkey .unknown::before{background:repeating-linear-gradient(135deg,var(--sub) 0 1.5px,transparent 1.5px 4px)}

/* Concept A: scope, the stacked channels */
.scope{background:var(--well);border-radius:var(--r2);overflow:hidden}
.scope-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px;padding:8px 12px;align-items:baseline;box-shadow:inset 0 -1px var(--line2)}
.scope-h h2{font-size:14px;font-weight:600}
.scope-cur{font:12.5px var(--fc);color:var(--sub)}
.ch{display:grid;grid-template-columns:172px minmax(0,1fr);box-shadow:inset 0 -1px var(--line2)}
.ch:last-of-type{box-shadow:none}
.ch-l{padding:6px 10px 6px 12px;min-width:0;box-shadow:inset -1px 0 var(--line2)}
.ch-l strong{display:block;font:500 12.5px var(--fc);color:var(--sub)}
.ch-l .val{display:flex;flex-wrap:wrap;gap:0 10px;font:400 14px var(--fb)}
.ch-l .val.big{display:block;font:300 24px/1.15 var(--fd);letter-spacing:-.01em}.ch-u{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sub);margin-top:2px}.ch-u i{width:10px;height:2px;background:var(--u)}
.ch-l .val.big small{font-size:12.5px;letter-spacing:0;color:var(--sub);font-weight:400;margin-left:3px}
.ch-l .val em{font-style:normal;display:inline-flex;align-items:center;gap:5px}
.ch-l .val em::before{content:"";width:9px;height:2px;background:var(--cc)}
.tr{position:relative;min-width:0}
.tr svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tr .ylab{position:absolute;left:5px;font:11.5px var(--fc);color:var(--sub);transform:translateY(-50%);background:var(--well);padding:0 3px;z-index:1;line-height:1.1}
.gapb{position:absolute;top:0;bottom:0;z-index:0}
.thr{position:absolute;left:0;right:0;border-top:1px dashed var(--warn);z-index:0}
.xh{position:absolute;top:0;bottom:0;width:1px;background:var(--acc);pointer-events:none;z-index:2}
.xaxis{display:grid;grid-template-columns:172px minmax(0,1fr)}
.xaxis>div{display:flex;justify-content:space-between;padding:4px 6px;font:12px var(--fc);color:var(--sub)}
.rd{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-bottom:var(--gap);background:var(--panel);border-radius:var(--r2)}
.rd>button{all:unset;box-sizing:border-box;cursor:pointer;display:block;padding:10px 14px;min-width:0;box-shadow:inset -1px 0 var(--line2)}.rd>button:last-child{box-shadow:none}
.rd>button:hover{background:var(--raise)}
.rd>button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.rd .l{display:block;font:500 12.5px var(--fc);color:var(--sub)}
.rd .v{display:block;font:300 26px/1.2 var(--fd);letter-spacing:-.01em}
.rd .v small{font-size:13px;letter-spacing:0;color:var(--sub);font-weight:400;margin-left:3px}
.rd .c{display:flex;flex-wrap:wrap;gap:0 10px;font-size:12.5px;color:var(--sub)}

.sa{height:100%;display:grid;grid-template-columns:186px minmax(0,1fr);position:relative}
.side{display:flex;flex-direction:column;min-height:0;padding:10px 8px;background:var(--panel);box-shadow:inset -1px 0 var(--line)}
.mark{display:flex;align-items:center;gap:8px;padding:2px 6px 12px;font:600 15px var(--fd);letter-spacing:-.01em}
.mark svg{color:var(--acc);flex:none}
.side h3{font:500 12.5px var(--fc);color:var(--sub);padding:10px 8px 3px}
.side button.n{display:flex;gap:9px;align-items:center;width:100%;border:0;background:none;padding:5px 8px;border-radius:var(--r1);color:var(--ink);text-align:left;font-weight:400}
.side button.n svg{color:var(--sub);flex:none}
.side button.n:hover{background:var(--raise)}
.side button.n[aria-current="page"]{background:var(--acc-s);font-weight:500}
.side button.n[aria-current="page"] svg{color:var(--acc)}
.side .foot{margin-top:auto}
.ma{display:flex;flex-direction:column;min-width:0;min-height:0}
.hd{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:7px 14px;min-height:44px;box-shadow:inset 0 -1px var(--line);background:var(--panel)}
.hd .ctx{font-size:13px}.hd .ctx b{font-weight:600}.hd .ctx span{color:var(--sub);margin-left:8px;font-family:var(--fc)}
.kbd{font:12px var(--fc);padding:0 5px;border:1px solid var(--line);border-radius:3px;color:var(--sub)}
.body{flex:1;min-height:0;overflow:auto;padding:12px 14px}
.sb{display:flex;gap:4px 18px;padding:4px 14px;background:var(--panel);box-shadow:inset 0 1px var(--line);font:12.5px var(--fc);color:var(--sub);white-space:nowrap;overflow-x:auto}
.sb button{all:unset;cursor:pointer}.sb button:hover{color:var(--ink);text-decoration:underline}
.sb button:focus-visible{outline:2px solid var(--acc)}
.sb .bad{color:var(--warn);font-weight:500}
.md{display:grid;grid-template-columns:minmax(0,1fr) 332px;gap:var(--gap);align-items:start}
.dock{position:sticky;top:0;background:var(--panel);border-radius:var(--r2);padding:12px}
.path{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;position:relative}
.path li{padding:10px 12px;position:relative;min-width:0;box-shadow:inset -1px 0 var(--line2)}
.path li:last-child{box-shadow:none}
.path li strong{display:block;font-weight:600;font-size:13.5px;margin-bottom:3px}
.path li p{font-size:12.5px;color:var(--sub);margin-top:4px}
.path li.warn{background:var(--warn-b)}

/* Concept B */
.sb2{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;position:relative}
.bh{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px 20px;padding:12px 28px}
.bh .mark{padding:0;font:500 22px var(--fd)}
.dock-n{display:flex;gap:2px;padding:3px;background:var(--raise);border-radius:999px}
.dock-n button{border:0;background:none;padding:6px 16px;border-radius:999px;font-weight:500;color:var(--sub)}
.dock-n button:hover{color:var(--ink)}
.dock-n button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.bb{min-height:0;overflow:auto;padding:6px 28px 32px}
.wrap{max-width:1320px;margin:0 auto}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,540px);grid-template-areas:"t d" "s d";grid-template-rows:auto 1fr;gap:0 44px;margin-bottom:30px}.h-t{grid-area:t;align-self:end;padding-top:34px}.say{grid-area:s}.dial{grid-area:d;align-self:center}
.hero h1{font:500 60px/1.0 var(--fd);letter-spacing:-.025em;text-wrap:balance;margin-bottom:12px}
.hero h1.warn-h{color:var(--warn)}
.hero .lead{font-size:18px;color:var(--sub);max-width:46ch;margin-bottom:22px}
.say li{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:4px 14px;padding:13px 0;align-items:baseline;border-top:1px solid var(--line)}
.say .k{color:var(--sub)}
.say .t{font:500 19px/1.25 var(--fd)}
.say .m{display:block;color:var(--sub);font:14px/1.4 var(--fb);margin-top:2px}
.dial{position:relative;width:100%;max-width:540px;margin:0 auto}
.dial svg{display:block;width:100%;height:auto;overflow:visible;outline-offset:6px;border-radius:50%}
.dial .wd{animation:sweep .4s ease-out both}
@keyframes sweep{from{opacity:.08}to{opacity:1}}
.dial .hl{fill:var(--ink);opacity:.14}
.dial .lab{fill:var(--sub);font:13px var(--fb)}
.dc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;width:36%}
.dc .v{display:block;font:500 40px/1 var(--fd);letter-spacing:-.02em}
.dc .u{display:block;font-size:13px;color:var(--sub);margin-top:3px}
.dk{display:flex;flex-wrap:wrap;gap:3px 14px;justify-content:center;margin-top:8px;font-size:12.5px;color:var(--sub)}
.dk i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tm{position:relative;height:var(--tmh,440px);border-radius:var(--r2);overflow:hidden;background:var(--well)}
.tg{position:absolute;padding:0}
.tg>span{position:absolute;left:8px;right:4px;top:4px;font:500 13px var(--fb);color:var(--ink);z-index:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

function readDial(dl,i){const s=store[dl.dataset.dial];if(!s)return;const dn=s.b.down[i],up=s.b.up[i];dl.querySelector('[data-dv]').textContent=dn==null?'—':Math.round(dn);dl.querySelector('[data-du]').textContent=dn==null?'No data at this time':`Mbps down, ${Math.round(up)} up`;dl.querySelector('[data-dt]').textContent=s.lab(i);const h=dl.querySelector('.hl');const TAU=Math.PI*2,step=TAU/96,a=i/96*TAU-Math.PI/2;h.setAttribute('d',sect(100,232,a,a+step));const sv=dl.querySelector('svg');sv.setAttribute('aria-valuenow',i);sv.setAttribute('aria-valuetext',`${s.lab(i)}, ${dn==null?'no data':Math.round(dn)+' megabits per second down'}`)}
function resetDial(dl){const s=store[dl.dataset.dial];if(!s)return;const c=s.b;dl.querySelector('[data-dv]').textContent=Math.round(c.down[60]);dl.querySelector('[data-du]').textContent='Mbps down now';dl.querySelector('[data-dt]').textContent='15:00';dl.querySelector('.hl').setAttribute('d','')}
let lastScope=null,lastDial=null;
document.addEventListener('mousemove',e=>{const t=e.target;if(!t.closest)return;
 const w=t.closest('[data-w]');if(w){lastDial=w.closest('.dial');readDial(lastDial,+w.dataset.w)}else if(lastDial&&!t.closest('.dial svg')){resetDial(lastDial);lastDial=null}
 const tr=t.closest('.scope[data-scope] .tr');
 if(tr){const sc=tr.closest('.scope'),reg=store[sc.dataset.scope];if(!reg)return;const r=tr.getBoundingClientRect(),f=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),i=Math.round(f*(reg.n-1));lastScope=sc;
  sc.querySelectorAll('.tr').forEach(x=>{let h=x.querySelector(':scope > .xh');if(!h){h=document.createElement('div');h.className='xh';x.append(h)}h.style.left=(i/(reg.n-1)*100)+'%'});
  sc.querySelectorAll('[data-chv]').forEach(v=>{const fn=reg.rows[v.dataset.chv];if(fn)v.innerHTML=fn(i)});sc.querySelector('[data-cur]').textContent='Cursor at '+reg.time(i);}
 else if(lastScope&&!t.closest('.scope[data-scope]')){const reg=store[lastScope.dataset.scope];lastScope.querySelectorAll('.xh').forEach(x=>x.remove());if(reg){lastScope.querySelectorAll('[data-chv]').forEach(v=>{if(reg.def[v.dataset.chv]!=null)v.innerHTML=reg.def[v.dataset.chv]});lastScope.querySelector('[data-cur]').textContent=(S.period==='today'?'Now, 15:00':'Latest sample')+', '+PER[S.period].r}lastScope=null}
});
readHash();render();window.addEventListener('hashchange',()=>{readHash();render()});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>render(true),120)});
</script>
