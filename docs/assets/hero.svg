<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">FortiLens — see your FortiGate clearly</title>
  <desc id="desc">Project banner showing the two evidence paths from one FortiGate: read-only API monitoring and received traffic-log accounting. FortiLens is self-hosted; missing telemetry stays unknown.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="m1 1 5 3-5 3" fill="none" stroke="#a7b5ba" stroke-width="1.2"/></marker>
  </defs>
  <rect x=".5" y=".5" width="1279" height="319" rx="5" fill="#1a2024" stroke="#3d484f"/>
  <path d="M632 32v256" stroke="#3d484f"/>
  <g font-family="'Segoe UI',Arial,sans-serif">
    <g transform="translate(60 44) scale(2.2)" fill="none" stroke="#84c9dc"><path d="M12 3a9 9 0 1 1-8.6 6.3" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="12" r="3.2" stroke-width="1.6"/></g>
    <text x="130" y="85" fill="#e9eff1" font-size="38" font-weight="600" letter-spacing="-.8">FortiLens</text>
    <text x="64" y="151" fill="#e9eff1" font-size="31" font-weight="500" letter-spacing="-.5">See your FortiGate clearly.</text>
    <text x="64" y="186" fill="#a7b5ba" font-size="17">Native monitoring. Recorded usage. Honest evidence.</text>
    <path d="M64 233h516" stroke="#3d484f"/>
    <text x="64" y="268" fill="#a7b5ba" font-size="14">Self-hosted</text>
    <circle cx="156" cy="263" r="2" fill="#a7b5ba"/>
    <text x="172" y="268" fill="#a7b5ba" font-size="14">One firewall per installation</text>
    <circle cx="351" cy="263" r="2" fill="#a7b5ba"/>
    <text x="367" y="268" fill="#a7b5ba" font-size="14">Open source</text>
    <text x="680" y="56" fill="#e9eff1" font-size="16" font-weight="500">One workspace, two evidence paths</text>
    <rect x="680" y="104" width="118" height="112" rx="3" fill="#22292e" stroke="#3d484f"/>
    <g transform="translate(717 123)" fill="none" stroke="#a7b5ba" stroke-width="1.5"><rect width="44" height="30" rx="2"/><path d="M0 10h44M0 20h44M14 0v10M30 0v10M7 10v10M23 10v10M37 10v10M14 20v10M30 20v10"/></g>
    <text x="739" y="190" fill="#e9eff1" font-size="16" font-weight="500" text-anchor="middle">FortiGate</text>
    <g fill="none" stroke="#a7b5ba" stroke-width="1.5" marker-end="url(#arrow)"><path d="M798 137h40v-19h54"/><path d="M798 183h40v37h54"/></g>
    <g fill="#161b1f" stroke="#3d484f"><rect x="906" y="82" width="310" height="72" rx="3"/><rect x="906" y="184" width="310" height="72" rx="3"/></g>
    <text x="924" y="110" fill="#e9eff1" font-size="16" font-weight="500">Read-only API</text>
    <text x="924" y="135" fill="#a7b5ba" font-size="14">WAN &amp; interface monitoring</text>
    <text x="924" y="212" fill="#e9eff1" font-size="16" font-weight="500">Received traffic logs</text>
    <text x="924" y="237" fill="#a7b5ba" font-size="14">Device &amp; segment usage</text>
    <text x="680" y="288" fill="#a7b5ba" font-size="13">Missing telemetry stays unknown.</text>
  </g>
</svg>
