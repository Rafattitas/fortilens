<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="490" viewBox="0 0 1120 490" role="img" aria-labelledby="title desc">
  <title id="title">How FortiLens fits together</title>
  <desc id="desc">The FortiGate sends metrics over its HTTPS API to the FortiGate Exporter and Prometheus, and syslog to Alloy and Loki. Grafana reads both stores, and optional accounting reads Loki. An optional gateway protects Grafana and reports. Web management reaches the gateway through fortilens-helper and fortilens-web, which serves the administrator's browser.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="m1 1 5 3-5 3" fill="none" stroke="#a7b5ba" stroke-width="1.2"/></marker>
    <marker id="arrow-acc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="m1 1 5 3-5 3" fill="none" stroke="#84c9dc" stroke-width="1.2"/></marker>
  </defs>
  <rect x=".5" y=".5" width="1119" height="489" rx="5" fill="#1a2024" stroke="#3d484f"/>
  <g font-family="'Segoe UI',Arial,sans-serif">

    <!-- Containers -->
    <rect x="200" y="30" width="610" height="365" rx="4" fill="#161b1f" stroke="#3d484f"/>
    <rect x="840" y="150" width="256" height="245" rx="4" fill="#161b1f" stroke="#3d484f"/>
    <text x="216" y="60" fill="#e9eff1" font-size="16" font-weight="600">Monitoring stack</text>
    <text x="350" y="60" fill="#a7b5ba" font-size="13.5">Docker Compose</text>
    <text x="862" y="180" fill="#e9eff1" font-size="16" font-weight="600">Web management</text>
    <text x="1012" y="180" fill="#a7b5ba" font-size="13.5">systemd</text>
    <text x="216" y="108" fill="#a7b5ba" font-size="12" font-weight="600" letter-spacing="1">METRICS</text>
    <text x="216" y="288" fill="#a7b5ba" font-size="12" font-weight="600" letter-spacing="1">LOGS</text>

    <!-- Legend -->
    <rect x="862" y="48" width="26" height="16" rx="2" fill="none" stroke="#a7b5ba" stroke-dasharray="4 3"/>
    <text x="898" y="61" fill="#a7b5ba" font-size="13.5">Optional service</text>
    <path d="M862 92h26" stroke="#a7b5ba" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="898" y="97" fill="#a7b5ba" font-size="13.5">How data reaches you</text>

    <!-- Arrows -->
    <g fill="none" stroke="#a7b5ba" stroke-width="1.5" marker-end="url(#arrow)">
      <path d="M134 218h26v-68h56"/>
      <path d="M134 262h26v68h56"/>
      <path d="M351 150h28"/>
      <path d="M514 150h28"/>
      <path d="M351 330h28"/>
      <path d="M514 330h28"/>
      <path d="M446 297v-57h163v-57"/>
      <path d="M677 150h70v57"/>
      <path d="M677 330h70v-57"/>
    </g>
    <g fill="none" stroke="#84c9dc" stroke-width="1.5" marker-end="url(#arrow-acc)">
      <path d="M795 240h67"/>
      <path d="M968 273v32"/>
      <path d="M968 371v49"/>
    </g>
    <text x="137" y="141" fill="#a7b5ba" font-size="12">HTTPS API</text>
    <text x="137" y="349" fill="#a7b5ba" font-size="12">Syslog</text>

    <!-- FortiGate -->
    <rect x="24" y="185" width="110" height="110" rx="3" fill="#22292e" stroke="#3d484f"/>
    <g transform="translate(57 203)" fill="none" stroke="#a7b5ba" stroke-width="1.5"><rect width="44" height="30" rx="2"/><path d="M0 10h44M0 20h44M14 0v10M30 0v10M7 10v10M23 10v10M37 10v10M14 20v10M30 20v10"/></g>
    <text x="79" y="262" fill="#e9eff1" font-size="16" font-weight="500" text-anchor="middle">FortiGate</text>
    <text x="79" y="280" fill="#a7b5ba" font-size="12.5" text-anchor="middle">Never changed</text>

    <!-- Services -->
    <g fill="#22292e" stroke="#3d484f">
      <rect x="216" y="117" width="135" height="66" rx="3"/>
      <rect x="379" y="117" width="135" height="66" rx="3"/>
      <rect x="542" y="117" width="135" height="66" rx="3"/>
      <rect x="216" y="297" width="135" height="66" rx="3"/>
      <rect x="379" y="297" width="135" height="66" rx="3"/>
      <rect x="862" y="207" width="212" height="66" rx="3"/>
      <rect x="862" y="305" width="212" height="66" rx="3"/>
    </g>
    <g fill="#22292e" stroke="#a7b5ba" stroke-dasharray="4 3">
      <rect x="542" y="297" width="135" height="66" rx="3"/>
      <rect x="700" y="207" width="95" height="66" rx="3"/>
    </g>
    <g fill="#e9eff1" font-size="15.5" font-weight="500" text-anchor="middle">
      <text x="283.500" y="146" font-size="14.5">FortiGate Exporter</text>
      <text x="446.500" y="146">Prometheus</text>
      <text x="609.500" y="146">Grafana</text>
      <text x="283.500" y="326">Alloy</text>
      <text x="446.500" y="326">Loki</text>
      <text x="609.500" y="326">Accounting</text>
      <text x="747.500" y="236">Gateway</text>
      <text x="968" y="236">fortilens-helper</text>
      <text x="968" y="334">fortilens-web</text>
    </g>
    <g fill="#a7b5ba" font-size="13" text-anchor="middle">
      <text x="283.500" y="167">Reads metrics</text>
      <text x="446.500" y="167">Stores metrics</text>
      <text x="609.500" y="167">Live dashboards</text>
      <text x="283.500" y="347">Receives logs</text>
      <text x="446.500" y="347">Stores raw logs</text>
      <text x="609.500" y="347">Usage reports</text>
      <text x="747.500" y="257">Protected</text>
      <text x="968" y="257">Fixed operations only</text>
      <text x="968" y="355">Console and setup</text>
    </g>

    <text x="216" y="440" fill="#a7b5ba" font-size="13.5">With the portable CLI, the same stack runs without web management.</text>
    <rect x="888" y="420" width="160" height="46" rx="23" fill="#24414b" stroke="#84c9dc"/>
    <text x="968" y="448" fill="#e9eff1" font-size="15.5" font-weight="500" text-anchor="middle">Your browser</text>
  </g>
</svg>
