<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">FortiLens Overview — synthetic illustration</title>
  <desc id="desc">A vector illustration of the FortiLens Overview, using invented demonstration values. It shows a divided evidence summary, two WAN history channels with hatched gaps, received-log usage and segment totals. This is not a screenshot or live telemetry; it does not establish collection completeness.</desc>
  <defs>
    <pattern id="missing" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#161b1f"/><path d="M0 0v7" stroke="#4e5b62" stroke-width="2"/></pattern>
  </defs>
  <rect width="1280" height="720" rx="5" fill="#1a2024"/>
  <path d="M0 0h186v682H0z" fill="#22292e"/>
  <path d="M186 0v682M186 56h1094M0 682h1280" fill="none" stroke="#3d484f"/>
  <g font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#e9eff1">
    <g transform="translate(17 16)" fill="none" stroke="#84c9dc"><path d="M12 3a9 9 0 1 1-8.6 6.3" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="12" r="3.2" stroke-width="1.6"/></g>
