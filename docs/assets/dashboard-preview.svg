    <text x="210" y="34" font-size="14">Demo workspace</text>
    <rect x="1003" y="14" width="253" height="28" rx="3" fill="#2c363b" stroke="#3d484f"/>
    <text x="1129" y="33" font-size="11" font-weight="600" letter-spacing=".6" text-anchor="middle" fill="#a7b5ba">SYNTHETIC ILLUSTRATION</text>

    <g fill="#a7b5ba" font-size="11"><text x="18" y="92">Network</text><text x="18" y="334">Trust</text><text x="18" y="421">Installation</text></g>
    <rect x="8" y="104" width="170" height="36" rx="3" fill="#24414b"/>
    <rect x="8" y="110" width="2" height="24" fill="#84c9dc"/>
    <text x="26" y="127" fill="#84c9dc" font-weight="600">Overview</text>
    <g fill="#a7b5ba"><text x="38" y="164">Live monitoring</text><text x="26" y="203">Internet</text><text x="26" y="242">Usage</text><text x="38" y="279">Segments</text><text x="38" y="309">Reports</text><text x="26" y="369">Evidence</text><text x="26" y="456">System</text><text x="38" y="492">Diagnostics</text><text x="26" y="531">Settings</text><text x="18" y="652" font-size="12">Native Grafana ↗</text></g>

    <text x="210" y="97" font-size="25" font-weight="500" letter-spacing="-.4">Network overview</text>
    <text x="210" y="121" fill="#a7b5ba">Internet state, received usage and the evidence behind them.</text>
    <text x="1256" y="99" text-anchor="end" fill="#84c9dc" font-size="12">Reload view</text>
    <rect x="210" y="144" width="1046" height="88" rx="5" fill="#22292e"/>
    <circle cx="231" cy="174" r="5" fill="#6ad5a5"/>
    <text x="247" y="180" font-size="18" font-weight="600">All links pass and logs are current.</text>
    <text x="226" y="205" fill="#a7b5ba">primary 12.4 ms, backup 21.6 ms. Last log 8 seconds ago.</text>
    <path d="M758 160v56M930 160v56M1069 160v56" stroke="#3d484f"/>
    <g fill="#a7b5ba" font-size="12"><text x="778" y="174">Recorded today</text><text x="950" y="174">Identities</text><text x="1089" y="174">Pending, not added</text></g>
    <g font-size="21" font-weight="300"><text x="778" y="205">12.8 GB</text><text x="950" y="205">6</text><text x="1089" y="205">18 MB</text></g>

    <rect x="210" y="248" width="680" height="197" rx="5" fill="#161b1f"/>
    <text x="224" y="275" font-size="15" font-weight="600">Network channels</text>
    <text x="697" y="275" fill="#a7b5ba" font-size="12">Last 24 hours</text>
    <rect x="801" y="257" width="76" height="26" rx="3" fill="#22292e" stroke="#3d484f"/>
