    <text x="222" y="592">backup</text><text x="323" y="592" fill="#6ad5a5">UP</text><text x="440" y="592" fill="#6ad5a5">UP</text><text x="535" y="592" fill="#a7b5ba">Not selected</text><text x="780" y="592" text-anchor="end">0.8 / 0.2</text><text x="878" y="592" text-anchor="end">0%</text>
    <text x="210" y="631" fill="#a7b5ba" font-size="11">Hatched time has no evidence. It is not an observed outage.</text>

    <rect x="906" y="248" width="350" height="239" rx="5" fill="#22292e"/>
    <text x="920" y="275" font-size="15" font-weight="600">Largest recorded consumers</text>
    <text x="920" y="310" fill="#84c9dc">demo-laptop</text><text x="1242" y="310" text-anchor="end">4.6 GB</text>
    <text x="920" y="329" fill="#a7b5ba" font-size="11">VLAN 20, staff</text><path d="M920 341h197" stroke="#e9eff1" stroke-width="4"/><path d="M1117 341h77" stroke="#8399a3" stroke-width="4"/>
    <text x="920" y="370" fill="#84c9dc">demo-workstation</text><text x="1242" y="370" text-anchor="end">2.2 GB</text>
    <text x="920" y="389" fill="#a7b5ba" font-size="11">VLAN 20, staff</text><path d="M920 401h102" stroke="#e9eff1" stroke-width="4"/><path d="M1022 401h29" stroke="#8399a3" stroke-width="4"/>
    <text x="920" y="436" fill="#a7b5ba" font-size="11">Device names are not user accounts.</text>
    <text x="920" y="455" fill="#a7b5ba" font-size="11">Totals cover received logs only.</text>
    <rect x="906" y="503" width="350" height="138" rx="5" fill="#22292e"/>
    <text x="920" y="530" font-size="15" font-weight="600">By segment</text>
    <text x="920" y="562" fill="#a7b5ba">VLAN 20, staff</text><text x="1242" y="562" text-anchor="end">9.2 GB</text><path d="M920 575h294" stroke="#e9eff1" stroke-width="4"/>
    <text x="920" y="607" fill="#a7b5ba">VLAN 30, guest</text><text x="1242" y="607" text-anchor="end">3.6 GB</text><path d="M920 620h115" stroke="#e9eff1" stroke-width="4"/>

    <text x="24" y="706" fill="#a7b5ba" font-size="12">Vector product illustration · Invented demonstration values · Not a live dashboard screenshot</text>
    <text x="1256" y="706" text-anchor="end" fill="#a7b5ba" font-size="12">One FortiGate per installation</text>
