# Optional native FortiGate UDP adapter. Review docs/SYSLOG_NATIVE_UDP.md first.
# Example addresses only: replace both 192.0.2.x values before installation.
# Run as a separate rsyslog instance; do not include the system logger's rules.
module(load="imudp")

# Keep the complete native logfmt body, including date/time/devid/eventtime.
# Octet-counted TCP supplies framing, so this template needs no trailing LF.
template(name="FortiLensNativeRFC5424" type="string"
  string="<%pri%>1 %timegenerated:::date-rfc3339% fortigate fortigate - - - %rawmsg-after-pri%")

# Both queues are memory-only. Do not add queue.filename or raw file outputs.
# Full queues discard input; UDP cannot provide backpressure or lossless delivery.
main_queue(queue.type="LinkedList" queue.size="1000" queue.timeoutEnqueue="0")

ruleset(name="FortiLensNativeUDP") {
  # Source-address filtering is not authentication; UDP addresses can be spoofed.
  if $fromhost-ip != "192.0.2.1" then stop

  action(type="omfwd" target="127.0.0.1" port="1514" protocol="tcp"
    template="FortiLensNativeRFC5424" TCP_Framing="octet-counted"
    action.resumeRetryCount="-1"
    queue.type="LinkedList" queue.size="1000" queue.timeoutEnqueue="0")
  stop
}

input(type="imudp" address="192.0.2.10" port="514" IpFreeBind="0"
  ruleset="FortiLensNativeUDP")
