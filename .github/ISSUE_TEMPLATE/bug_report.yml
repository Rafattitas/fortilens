name: Bug report
description: Report a reproducible problem with sanitized evidence.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: Do not include tokens, passwords, client logs, or unredacted configurations. Report security issues through SECURITY.md.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS/architecture, Python, Docker Compose, FortiOS, and FortiLens revision.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use a minimal synthetic example where possible.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Relevant errors or redacted doctor output; explain any missing-data limits.
