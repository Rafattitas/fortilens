name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Repository quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            management/requirements*.txt
      - name: Install development checks
        run: python -m pip install -r requirements-dev.txt
      - name: Check Python correctness
        run: python -m ruff check .
      - name: Check new tooling imports and formatting
        run: |
          python -m ruff check tools tests/test_repository_checks.py tests/test_release.py --extend-select I
          python -m ruff format --check tools tests/test_repository_checks.py tests/test_release.py
      - name: Check source grammar, documentation links and workflow YAML
        run: python tools/check_repository.py
      - name: Audit development and management dependency advisories
        run: python -m pip_audit --strict -r requirements-dev.txt

  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.12'
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build allowlisted distribution
        run: python portable/setup.py bundle --destination dist/fortilens-single-device.zip

  integration:
    name: Isolated Docker pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate pinned applications and synthetic end-to-end accounting
        run: python tests/integration_stack.py

  management:
    name: Web management / Python 3.12
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Set up development-only JavaScript syntax checker
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install management test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check shipped browser JavaScript syntax
        run: python tests/check_frontend.py
      - name: Run all tests with branch coverage
        run: python -m coverage run -m unittest discover -s tests -v
      - name: Report measured coverage
        run: |
          python -m coverage report -m
          python -m coverage xml
      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: error
      - name: Run actual nonroot web / helper / Docker integration
        run: python tests/integration_management.py

  ubuntu-installer:
    name: Real Ubuntu systemd installer
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install explicit VM-only Python prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv
      - name: Bootstrap independent management twice without starting monitoring
        run: |
          sudo ./install.sh > "$RUNNER_TEMP/fortilens-install.log"
          sudo ./install.sh > "$RUNNER_TEMP/fortilens-install-repeat.log"
          sudo systemctl is-active --quiet fortilens-helper fortilens-web
          test "$(id -nG fortilens | tr ' ' '\n' | grep -c '^docker$')" = 0
      - name: Accept actual host services and disposable monitoring deployment
        run: sudo env GITHUB_ACTIONS=true /opt/fortilens/venv/bin/python tests/integration_management.py --installed
      - name: Show sanitized service logs on failure
        if: failure()
        run: |
          sudo systemctl status fortilens-web fortilens-helper --no-pager || true
          sudo journalctl -u fortilens-web -u fortilens-helper --no-pager -n 80
      - name: Stop test-only host management services
        if: always()
        run: sudo systemctl stop fortilens-web fortilens-helper || true
