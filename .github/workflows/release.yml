name: Release bundle

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  bundle:
    name: Test, package and attach release files
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out the released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate version tag
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Verify isolated Docker accounting pipeline
        run: python tests/integration_stack.py
      - name: Build allowlisted bundle and checksum
        shell: bash
        run: |
          python portable/setup.py bundle --destination "dist/fortilens-$RELEASE_TAG.zip"
          cd dist
          sha256sum "fortilens-$RELEASE_TAG.zip" > SHA256SUMS.txt
      - name: Attach verified files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" "dist/fortilens-$RELEASE_TAG.zip" dist/SHA256SUMS.txt
