version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      development-tools:
        patterns:
          - ruff
          - coverage
          - pip-audit
  - package-ecosystem: pip
    directory: /management
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
