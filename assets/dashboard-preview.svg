<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">FortiLens illustrative dashboard</title>
  <desc id="desc">A synthetic overview of WAN performance, device usage and interface review. This is an illustration, not a live dashboard screenshot.</desc>
  <defs>
